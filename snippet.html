<!--
  Acid Machine embed snippet.

  Paste this wherever the synth should appear on the page. The iframe starts
  at a sensible default height, then the app itself reports its real content
  height via postMessage once it loads (see index.html's closing script) and
  this listener resizes the frame to match -- so it never ends up with an
  inner scrollbar, and it keeps working if the app's content height changes
  in a future update.

  Swap the src="" below for wherever you end up hosting acid-machine/index.html.
-->
<iframe
  id="acid-machine-frame"
  src="/acid-machine/index.html"
  title="Acid Machine — TB-303 style synth"
  width="100%"
  height="900"
  loading="lazy"
  allow="autoplay"
  style="border:0; display:block; margin:0 auto; max-width:560px; border-radius:16px;">
</iframe>

<script>
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'acid-machine:height') return;
    var frame = document.getElementById('acid-machine-frame');
    if (frame) frame.style.height = e.data.height + 'px';
  });
</script>
