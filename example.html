<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed preview — Acid Machine</title>
<style>
  body{ margin:0; font-family:system-ui,sans-serif; background:#f2f2f5; color:#222; }
  header{ background:#111; color:#fff; padding:18px 20px; }
  header nav{ display:flex; gap:18px; font-size:14px; opacity:.8; margin-top:6px; }
  main{ max-width:760px; margin:0 auto; padding:30px 20px 60px; }
  h1{ font-size:22px; }
  p.lead{ color:#555; }
  .card{ background:#fff; border-radius:14px; padding:18px; box-shadow:0 2px 10px rgba(0,0,0,.06); margin-top:24px; }
</style>
</head>
<body>

<header>
  <strong>kg13</strong>
  <nav><span>Home</span><span>Projects</span><span>Tools</span><span>About</span></nav>
</header>

<main>
  <h1>Acid Machine</h1>
  <p class="lead">A little browser-based TB-303-style synth — this section of the page is
  just the surrounding site content; everything below the line is the embedded app.</p>

  <div class="card">
    <!-- ===== embed snippet begins ===== -->
    <iframe
      id="acid-machine-frame"
      src="../index.html"
      title="Acid Machine — TB-303 style synth"
      width="100%"
      height="900"
      loading="lazy"
      allow="autoplay"
      style="border:0; display:block; margin:0 auto; max-width:560px; border-radius:16px;">
    </iframe>
    <script>
      window.addEventListener('message', function (e) {
        if (!e.data || e.data.type !== 'acid-machine:height') return;
        var frame = document.getElementById('acid-machine-frame');
        if (frame) frame.style.height = e.data.height + 'px';
      });
    </script>
    <!-- ===== embed snippet ends ===== -->
  </div>
</main>

</body>
</html>
